<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materi Anggota - Pasker Smekindo Blitar Doko</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .welcome-section {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 20px 60px 20px;
      position: relative;
    }
    .welcome-card {
      max-width: 900px;
      width: 100%;
      padding: 50px 40px;
      text-align: center;
      background: var(--bg-card);
      border: 1.5px solid rgba(17, 17, 132, 0.4);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(17, 17, 132, 0.25);
      position: relative;
      z-index: 2;
    }
    .welcome-card h2 {
      font-family: var(--font-heading);
      font-size: 2rem;
      color: #fff;
      margin-bottom: 15px;
    }
    .welcome-card p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 40px;
    }
    .materi-menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .materi-nav-btn {
      background: rgba(4, 6, 15, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 22px 20px;
      border-radius: 10px;
      text-decoration: none;
      color: #fff;
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
    }
    .materi-nav-btn i {
      font-size: 1.8rem;
    }
    .materi-nav-btn:hover {
      background: var(--bg-card-hover);
      border-color: #4a4aff;
      box-shadow: 0 0 20px var(--neon-blue-glow);
      transform: translateY(-4px);
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <img src="logo.png" alt="Logo Pasker" class="nav-icon" onerror="this.style.display='none'">
        <span class="brand-text">Pasker <span class="neon-red-text">Smekindo</span></span>
      </a>
      <div class="nav-auth-buttons">
        <a href="index.html" class="btn-nav-join"><i class="fa-solid fa-right-from-bracket"></i> Keluar</a>
      </div>
    </div>
  </header>

  <div class="hero-glow-bg"></div>

  <!-- KONTEN UTAMA SAMBUTAN & 4 NAVIGASI HALAMAN -->
  <section class="welcome-section">
    <div class="welcome-card card interactive-card">
      <h2>Selamat Datang di Pasker Smekindo</h2>
      <p>Disini ada beberapa materi dasar yang dapat kalian pelajari.</p>
      
      <div class="materi-menu-grid">
        <a href="sejarahiks.html" class="materi-nav-btn">
          <i class="fa-solid fa-landmark icon-blue"></i>
          Sejarah IKS
        </a>
        <a href="pancaprasetya.html" class="materi-nav-btn">
          <i class="fa-solid fa-scroll icon-red"></i>
          Panca Prasetya
        </a>
        <a href="tingkatansabuk.html" class="materi-nav-btn">
          <i class="fa-solid fa-award icon-blue"></i>
          Tingkatan Sabuk
        </a>
        <a href="materidasar.html" class="materi-nav-btn">
          <i class="fa-solid fa-shield-halved icon-red"></i>
          Materi Dasar
        </a>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>

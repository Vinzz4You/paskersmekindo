<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="png" href="icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arsip - Pasker Smekindo Blitar Doko</title>

  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Style Utama -->
  <link rel="stylesheet" href="style.css">

  <style>
    .arsip-hero {
      position: relative;
      padding: 140px 20px 45px 20px;
      text-align: center;
      overflow: hidden;
    }

    .arsip-main-title {
      font-family: var(--font-heading);
      font-size: 3rem;
      font-weight: 800;
      color: #fff;
      min-height: 4.2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .typing-cursor-loop {
      display: inline-block;
      width: 3px;
      height: 2.6rem;
      background-color: var(--base-red);
      box-shadow: 0 0 12px var(--neon-red-glow);
      animation: blinkCursor 0.75s infinite;
    }

    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .arsip-subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-top: 10px;
    }

    .arsip-gallery-section {
      padding: 30px 0 95px 0;
      position: relative;
      z-index: 2;
    }

    .arsip-count-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(17, 17, 132, 0.25);
      border: 1px solid #4a4aff;
      color: #fff;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 0 15px var(--neon-blue-glow);
      margin-bottom: 30px;
    }

    /* Lightbox Preview Modal */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 3, 8, 0.92);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2000;
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-box {
      position: relative;
      max-width: 820px;
      width: 100%;
      background: var(--bg-card);
      border: 1.5px solid #4a4aff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 0 30px var(--neon-blue-glow), 0 0 18px var(--neon-red-glow);
      text-align: center;
    }

    .lightbox-box img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .lightbox-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--base-red);
      background: rgba(255, 39, 42, 0.2);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .lightbox-close:hover {
      background: var(--base-red);
      box-shadow: 0 0 15px var(--neon-red-glow);
    }

    @media (max-width: 768px) {
      .arsip-main-title {
        font-size: 2rem;
        min-height: 3rem;
      }
      .typing-cursor-loop {
        height: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <img src="logo.png" alt="Logo Pasker" class="nav-icon" onerror="this.style.display='none'">
        <span class="brand-text">Pasker <span class="neon-red-text">Smekindo</span></span>
      </a>

      <button class="mobile-toggle" id="mobile-toggle">
        <i class="fa-solid fa-bars"></i>
      </button>

      <nav class="nav-links" id="nav-links">
        <a href="index.html#beranda" class="nav-item">Beranda</a>
        <a href="index.html#filosofi" class="nav-item">Filosofi</a>
        <a href="arsip.html" class="nav-item active">Arsip</a>
        <a href="index.html#jadwal" class="nav-item">Jadwal</a>
        <a href="index.html#kontak" class="nav-item">Kontak</a>
        <div class="nav-auth-buttons">
          <a href="login.html" class="btn-nav-login">Login</a>
          <a href="daftar.html" class="btn-nav-join">Gabung Sekarang</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- HERO JUDUL ARSIP DENGAN EFEK TYPING BERULANG -->
  <section class="arsip-hero">
    <div class="hero-glow-bg"></div>
    <div class="hero-content" style="margin: 0 auto;">
      <h1 class="arsip-main-title">
        <span id="arsip-loop-text"></span><span class="typing-cursor-loop"></span>
      </h1>
      <p class="arsip-subtitle">Dokumentasi Kegiatan Pasker Smekindo Cabang Blitar Ranting Doko</p>
    </div>
  </section>

  <!-- GALERI ARSIP FOTO11.JPG - FOTO75.JPG -->
  <section class="arsip-gallery-section">
    <div class="container">
      <div class="section-header" style="margin-bottom: 25px;">
        <div class="arsip-count-badge">
          <i class="fa-solid fa-images icon-blue"></i>
          <span>75 Arsip Pasker Smekindo</span>
        </div>
        <div class="line-glow"></div>
      </div>

      <!-- Grid dibuat otomatis dari foto11.jpg sampai foto75.jpg -->
      <div class="gallery-grid" id="arsip-gallery-grid"></div>
    </div>
  </section>

  <!-- MODAL PREVIEW FOTO -->
  <div class="lightbox-modal" id="lightbox-modal" onclick="closeLightbox(event)">
    <div class="lightbox-box">
      <button class="lightbox-close" onclick="closeLightbox(event)" aria-label="Tutup">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <img id="lightbox-img" src="" alt="Preview Arsip">
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer-section">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <p>&copy; 2026 Pasker Smekindo - Cabang Blitar Ranting Doko. All Rights Reserved.</p>
      </div>
    </div>
  </footer>

  <!-- SCRIPT UTAMA (SCROLL REVEAL, KURSOR NEON, NAVBAR) -->
  <script src="script.js"></script>

  <!-- SCRIPT GENERATE FOTO11.JPG - FOTO75.JPG & LOOPING TYPING -->
  <script>
    (function () {
      const galleryGrid = document.getElementById('arsip-gallery-grid');
      const startNum = 11;
      const endNum = 75;

      // Generate item foto11.jpg sampai foto75.jpg tanpa label teks di foto
      for (let i = startNum; i <= endNum; i++) {
        const fileName = `foto${i}.jpg`;
        const item = document.createElement('div');
        item.className = 'gallery-item interactive-card reveal-init';
        item.style.transitionDelay = `${((i - startNum) % 3) * 0.12}s`;
        item.onclick = () => openLightbox(fileName);

        item.innerHTML = `
          <img src="${fileName}" alt="Dokumentasi Pasker Smekindo" loading="lazy" onerror="this.style.opacity='0.25'">
          <div class="gallery-overlay">
            <i class="fa-solid fa-magnifying-glass-plus"></i>
          </div>
        `;

        galleryGrid.appendChild(item);
      }

      // Daftarkan elemen galeri yang baru dibuat ke IntersectionObserver
      const newRevealItems = galleryGrid.querySelectorAll('.reveal-init');
      if (newRevealItems.length > 0) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('reveal-active');
            }
          });
        }, {
          threshold: 0.12,
          rootMargin: '0px 0px -40px 0px'
        });

        newRevealItems.forEach((el) => observer.observe(el));
      }

      // Efek Typing Berulang pada judul "Arsip Pasker Smekindo"
      const typingEl = document.getElementById('arsip-loop-text');
      const phrase = 'Arsip Pasker Smekindo';
      let charIdx = 0;
      let isDeleting = false;

      function loopTypeTitle() {
        if (!typingEl) return;

        if (!isDeleting) {
          typingEl.textContent = phrase.slice(0, charIdx + 1);
          charIdx++;

          if (charIdx === phrase.length) {
            isDeleting = true;
            setTimeout(loopTypeTitle, 1600);
            return;
          }
          setTimeout(loopTypeTitle, 95);
        } else {
          typingEl.textContent = phrase.slice(0, charIdx - 1);
          charIdx--;

          if (charIdx === 0) {
            isDeleting = false;
            setTimeout(loopTypeTitle, 400);
            return;
          }
          setTimeout(loopTypeTitle, 55);
        }
      }

      setTimeout(loopTypeTitle, 350);
    })();

    function openLightbox(fileName) {
      const modal = document.getElementById('lightbox-modal');
      const img = document.getElementById('lightbox-img');
      img.src = fileName;
      modal.classList.add('active');
    }

    function closeLightbox(event) {
      const modal = document.getElementById('lightbox-modal');
      if (
        event.target === modal ||
        event.target.closest('.lightbox-close')
      ) {
        modal.classList.remove('active');
        document.getElementById('lightbox-img').src = '';
      }
    }
  </script>
</body>
</html>

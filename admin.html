<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Pasker Smekindo Blitar Doko</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    .admin-dashboard-section {
      min-height: 90vh;
      padding: 110px 20px 60px;
      position: relative;
      z-index: 2;
    }

    .admin-container {
      max-width: 1100px;
      margin: auto;
    }

    .admin-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      background: var(--bg-card);
      padding: 22px 30px;
      border-radius: 12px;
      border: 1px solid rgba(255,39,42,.3);
      box-shadow: 0 0 20px rgba(255,39,42,.15);
      margin-bottom: 30px;
    }

    .admin-welcome h2 {
      font-family: var(--font-heading);
      color: #fff;
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .admin-welcome p {
      color: var(--text-muted);
      font-size: .9rem;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-bottom: 30px;
    }

    .admin-card, .full-width-card {
      background: var(--bg-card);
      border: 1.5px solid rgba(17,17,132,.4);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 25px rgba(17,17,132,.2);
    }

    .admin-card h3, .full-width-card h3 {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding-bottom: 12px;
    }

    .admin-card h3 i {
      color: var(--base-red);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: .88rem;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: rgba(4,6,15,.8);
      border: 1px solid rgba(255,255,255,.1);
      padding: 10px 14px;
      border-radius: 8px;
      color: #fff;
      font-family: var(--font-body);
      font-size: .92rem;
    }

    .form-control:focus {
      outline: none;
      border-color: #4a4aff;
    }

    .btn-admin-submit {
      width: 100%;
      padding: 11px;
      background: var(--base-red);
      color: #fff;
      font-family: var(--font-heading);
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 5px;
    }

    .btn-admin-submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .members-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: .9rem;
    }

    .members-table th,
    .members-table td {
      padding: 12px 15px;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .members-table th {
      color: #fff;
      background: rgba(17,17,132,.2);
    }

    .members-table td {
      color: var(--text-muted);
    }

    .members-table td strong {
      color: #fff;
    }

    .status-message {
      font-size: .88rem;
      margin-top: 14px;
      line-height: 1.5;
    }

    @media (max-width: 900px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <img src="logo.png" alt="Logo Pasker" class="nav-icon"
             onerror="this.style.display='none'">
        <span class="brand-text">
          Pasker <span class="neon-red-text">Smekindo</span>
        </span>
      </a>

      <div class="nav-auth-buttons">
        <button onclick="logoutAdmin()" class="btn-nav-join">
          <i class="fa-solid fa-right-from-bracket"></i> Keluar
        </button>
      </div>
    </div>
  </header>

  <div class="hero-glow-bg"></div>

  <section class="admin-dashboard-section">
    <div class="admin-container">

      <div class="admin-topbar">
        <div class="admin-welcome">
          <h2>Dashboard Admin Pasker Smekindo</h2>
          <p id="admin-session-info">Memeriksa sesi admin...</p>
        </div>

        <a href="materi.html" class="btn btn-neon-blue"
           style="padding:9px 18px;font-size:.85rem;">
          Portal Materi
        </a>
      </div>

      <div class="admin-grid">

        <div class="admin-card card interactive-card">
          <h3>
            <i class="fa-solid fa-user-plus"></i>
            Tambah Anggota Baru
          </h3>

          <form id="add-member-form">
            <div class="form-group">
              <label for="memberName">Nama Lengkap</label>
              <input
                type="text"
                id="memberName"
                class="form-control"
                placeholder="Nama anggota..."
                maxlength="100"
                required
              >
            </div>

            <div class="form-group">
              <label for="memberUsername">Username</label>
              <input
                type="text"
                id="memberUsername"
                class="form-control"
                placeholder="Username anggota..."
                minlength="3"
                maxlength="30"
                pattern="[a-zA-Z0-9._-]+"
                required
              >
            </div>

            <div class="form-group">
              <label for="memberPassword">Password</label>
              <input
                type="password"
                id="memberPassword"
                class="form-control"
                placeholder="Minimal 8 karakter"
                minlength="8"
                required
              >
            </div>

            <button type="submit" id="submit-member"
                    class="btn-admin-submit">
              Simpan Anggota
            </button>

            <p id="add-member-message" class="status-message"></p>
          </form>
        </div>

      </div>

      <div class="full-width-card card interactive-card">
        <h3>
          <i class="fa-solid fa-users-rectangle"></i>
          Daftar Anggota Terdaftar
        </h3>

        <div class="table-responsive">
          <table class="members-table">
            <thead>
              <tr>
                <th>No</th>
                <th>Nama Lengkap</th>
                <th>Username</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody id="members-table-body">
              <tr>
                <td colspan="4" style="text-align:center;">
                  Memuat data anggota...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <p id="members-message" class="status-message"></p>
      </div>

    </div>
  </section>

  <script>
    const TOKEN_KEY = "access_token";

    const token = sessionStorage.getItem(TOKEN_KEY);

    function logoutAdmin() {
      sessionStorage.removeItem(TOKEN_KEY);
      window.location.href = "login.html";
    }

    function showLoginError(message) {
      alert(message);
      sessionStorage.removeItem(TOKEN_KEY);
      window.location.href = "login.html";
    }

    async function verifyAdmin() {
      if (!token) {
        showLoginError("Sesi login tidak ditemukan. Silakan login kembali.");
        return false;
      }

      try {
        const response = await fetch("/api/me", {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        const result = await response.json();

        if (!response.ok || !result.success ||
            result.member?.role !== "admin") {
          showLoginError("Akses khusus administrator.");
          return false;
        }

        document.getElementById("admin-session-info").textContent =
          `Selamat datang, ${result.member.full_name}`;

        return true;

      } catch (error) {
        document.getElementById("admin-session-info").textContent =
          "Gagal menghubungi server. Periksa koneksi internet.";
        return false;
      }
    }

    async function fetchMembersData() {
      const tbody = document.getElementById("members-table-body");
      const message = document.getElementById("members-message");

      tbody.innerHTML = `
        <tr><td colspan="4" style="text-align:center;">
          Memuat data anggota...
        </td></tr>
      `;

      try {
        const response = await fetch("/api/members", {
          method: "GET",
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || "Gagal mengambil data anggota.");
        }

        const members = result.members || [];

        if (members.length === 0) {
          tbody.innerHTML = `
            <tr><td colspan="4" style="text-align:center;">
              Belum ada anggota terdaftar.
            </td></tr>
          `;
          return;
        }

        tbody.innerHTML = "";

        members.forEach((member, index) => {
          const tr = document.createElement("tr");

          const values = [
            index + 1,
            member.full_name,
            member.username,
            member.is_active ? "Aktif" : "Nonaktif"
          ];

          values.forEach((value, i) => {
            const td = document.createElement("td");
            if (i === 1) {
              const strong = document.createElement("strong");
              strong.textContent = value ?? "-";
              td.appendChild(strong);
            } else {
              td.textContent = value ?? "-";
            }
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });

        message.textContent = "";

      } catch (error) {
        tbody.innerHTML = `
          <tr><td colspan="4" style="text-align:center;">
            Data anggota gagal dimuat.
          </td></tr>
        `;
        message.textContent = error.message;
      }
    }

    document.getElementById("add-member-form")
      .addEventListener("submit", async function(event) {
        event.preventDefault();

        const button = document.getElementById("submit-member");
        const message = document.getElementById("add-member-message");

        const full_name = document.getElementById("memberName").value.trim();
        const username = document.getElementById("memberUsername").value.trim();
        const password = document.getElementById("memberPassword").value;

        button.disabled = true;
        button.textContent = "Menyimpan...";
        message.textContent = "";

        try {
          const response = await fetch("/api/members", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              full_name,
              username,
              password
            })
          });

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || "Gagal membuat akun anggota.");
          }

          message.textContent = "Akun anggota berhasil dibuat!";
          message.style.color = "#4ade80";

          this.reset();
          await fetchMembersData();

        } catch (error) {
          message.textContent = error.message;
          message.style.color = "#ff4545";
        } finally {
          button.disabled = false;
          button.textContent = "Simpan Anggota";
        }
      });

    async function initializeDashboard() {
      const isAdmin = await verifyAdmin();

      if (isAdmin) {
        await fetchMembersData();
      }
    }

    initializeDashboard();
  </script>

</body>
</html>
